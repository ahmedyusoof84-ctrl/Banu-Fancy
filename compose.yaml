services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: smart_retail
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail -d smart_retail"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://retail:${POSTGRES_PASSWORD}@db:5432/smart_retail
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:?Set the HTTPS origin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set initial administrator email}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set initial administrator password}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - backups:/app/backups
    restart: unless-stopped
volumes:
  postgres_data:
  backups:
