# Free Render web service. Supply a persistent external PostgreSQL DATABASE_URL,
# such as a Neon Free project. Never rely on the web service's ephemeral disk.
# Restore existing shop data through Settings after deployment.
services:
  - type: web
    name: smart-retail
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_PERSISTENT_DB
        value: 'true'
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
